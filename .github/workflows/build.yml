name: Build and publish

on:
    push:
        tags:
            - "*"
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2

            - name: Prepare
              run: |
                mkdir _out
                gunzip -c _tools/boot.img.gz > boot.img
                sha256sum -c _tools/boot.img.sha256sum
                tar xf _tools/AIK-Linux-v3.8-ALL.tar.gz

            # - name: Download tools
            #   run: |
            #     wget --content-disposition https://xdaforums.com/attachments/aik-linux-v3-8-all-tar-gz.5300923/
            #     tar xf AIK-Linux-v3.8-ALL.tar.gz

            - name: Build
              run: ./build.sh

            - name: Repack Official Kernel
              run: |
                cd AIK-Linux
                ./unpackimg.sh ../boot.img
                cp ../out/arch/arm64/boot/Image.gz split_img/boot.img-kernel
                ./repackimg.sh --origsize
                cp image-new.img ../_out/boot.img
                cp ../out/arch/arm64/boot/Image.gz ../_out/Image.gz
                ./cleanup.sh

            - name: Upload binaries to release
              uses: svenstaro/upload-release-action@v2
              with:
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  file: _out/*
                  file_glob: true
                  overwrite: true
                  tag: ${{ github.ref }}
                  release_name: ${{ github.ref_name }}
